[project]
name = "dora-openarm-selector"
version = "0.2.0"
authors = [{ name = "Enactic, Inc." }]
description = "dora-rs node that forwards messages only from the highest-priority enabled source"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "dora-rs >= 1.0.0",
  "pyarrow",
]

[project.urls]
Changelog = "https://github.com/enactic/dora-openarm-selector/releases"
Issues = "https://github.com/enactic/dora-openarm-selector/issues"
Repository = "https://github.com/enactic/dora-openarm-selector"

[project.scripts]
dora-openarm-selector = "dora_openarm_selector.main:main"
dora-openarm-standby = "dora_openarm_selector.standby:main"

[dependency-groups]
dev = [
  "dora-rs-cli >= 1.0.0",
  "pytest >= 8.1.1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
extend-select = [
  "D",   # pydocstyle
  "UP"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
